authors="Normies"
description='''
Grimoire Addams NeoForge : interface listant toutes les commandes du serveur, triees par mod.
Requis cote client ET serveur (NeoForge uniquement, aucune autre lib).
'''

[[dependencies.${mod_id}]]
modId="neoforge"
type="required"
versionRange="${neo_version_range}"
